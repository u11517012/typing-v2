<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Typing Game | Version 02</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top,
                    #25204a 0%,
                    #11111f 45%,
                    #080810 100%
                );

            color: #ffffff;

            font-family:
                "Segoe UI",
                "Microsoft JhengHei",
                sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 760px;
            text-align: center;
        }

        /* 版本標籤 */

        .version {
            color: #8f8cff;
            font-size: 14px;
            letter-spacing: 4px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        /* 主標題 */

        h1 {
            margin: 0;
            font-size: 48px;
            letter-spacing: 2px;
        }

        .subtitle {
            margin-top: 15px;
            color: #aaa9bd;
            font-size: 16px;
        }

        /* 遊戲卡片 */

        .game-card {
            margin-top: 40px;
            padding: 40px 30px;

            background: rgba(255, 255, 255, 0.06);

            border: 1px solid rgba(143, 140, 255, 0.25);
            border-radius: 20px;

            box-shadow:
                0 0 40px rgba(104, 92, 255, 0.12),
                inset 0 0 30px rgba(255, 255, 255, 0.02);
        }

        /* 鍵盤圖片 */

        .keyboard {
            width: 100%;
            max-width: 560px;
            height: auto;

            display: block;
            margin: 0 auto 30px auto;

            border-radius: 12px;

            box-shadow:
                0 0 25px rgba(124, 108, 255, 0.18);
        }

        /* 說明文字 */

        .instruction {
            color: #c4c3d4;
            margin: 0 0 28px 0;
            font-size: 16px;
        }

        /* 開始按鈕 */

        .start-btn {
            border: none;
            border-radius: 12px;

            padding: 14px 38px;

            background:
                linear-gradient(
                    135deg,
                    #7c6cff,
                    #a66cff
                );

            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 0 20px rgba(124, 108, 255, 0.35);

            transition: all 0.25s ease;
        }

        .start-btn:hover {
            transform: translateY(-3px);

            box-shadow:
                0 0 30px rgba(124, 108, 255, 0.6);
        }

        .start-btn:active {
            transform: translateY(0);
        }

        /* 頁尾 */

        footer {
            margin-top: 35px;
            color: #666579;
            font-size: 13px;
        }

        /* 手機版 */

        @media (max-width: 600px) {

            h1 {
                font-size: 36px;
            }

            .game-card {
                padding: 30px 20px;
            }

            .keyboard {
                max-width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="version">
            TYPING GAME · VERSION 02
        </div>

        <h1>英打遊戲</h1>

        <p class="subtitle">
            Test your typing speed.
        </p>

        <div class="game-card">

            <!-- 鍵盤圖片 -->
            <img
                src="assets/keyboard.png"
                alt="英打遊戲鍵盤"
                class="keyboard"
            >

            <p class="instruction">
                準備好挑戰你的英文打字能力了嗎？
            </p>

            <!-- 開始按鈕 -->
            <button
                class="start-btn"
                id="startButton"
            >
                開始遊戲
            </button>

        </div>

        <footer>
            VERSION 02 · 2026
        </footer>

    </div>

    <!-- 音效 -->
    <audio
        id="beepSound"
        src="assets/beep.wav"
        preload="auto">
    </audio>


    <script>

        const startButton =
            document.getElementById("startButton");

        const beepSound =
            document.getElementById("beepSound");


        startButton.addEventListener("click", function () {

            // 從頭播放音效
            beepSound.currentTime = 0;

            beepSound.play();

        });

    </script>

</body>
</html>
